plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'gdg.challenge'
version = '0.0.1-SNAPSHOT'
description = 'Challenge Track project for GDG Solution Challenge'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('org.springframework.ai:spring-ai-bom:1.1.2')
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai' // gemini api 사용을 위한 의존성
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	compileOnly 'org.projectlombok:lombok'
	implementation 'com.mysql:mysql-connector-j:9.5.0'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'com.google.cloud.sql:mysql-socket-factory-connector-j-8:1.19.1'
	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// firebase
	implementation 'com.google.firebase:firebase-admin:9.4.3'

	// Android OAuth
	implementation 'com.google.api-client:google-api-client:2.2.0'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.19.0'

}

tasks.named('test') {
	useJUnitPlatform()
	// 테스트 소스가 없으면 :test 스킵. (프로젝트 경로에 한글 등이 있을 때 Gradle 테스트 워커가
	// test 클래스를 classpath에서 못 찾는 ClassNotFoundException이 나는 환경이 있어,
	// 통합 테스트는 ASCII 경로 클론 또는 IDE에서 돌리는 편이 안전함.)
	onlyIf { !sourceSets.test.allSource.isEmpty() }
}
