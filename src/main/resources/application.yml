server:
  port: 8080

# Spring AI - Gemini (API 키는 GenAiApiKeyConfig에서 하드코딩)
spring:
  ai:
    retry:
      max-attempts: 1   # ChatClient 등 전역 재시도 1회로 제한 
    model:
      chat: google-genai
    google:
      genai:
        chat:
          options:
            model: gemini-3-flash-preview
            temperature: 0.7
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

cors:
  urls:
    - http://localhost:8080
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:5174

  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE


jwt:
  secret: ${JWT_SECRET}
  time:
    access-token: 3600000
    refresh-token: 10000000
