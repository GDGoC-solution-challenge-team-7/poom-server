# local 프로필: VOICE_WS_URL 환경변수로 음성 서버 URL 오버라이드 가능
voice:
  websocket-url: ${VOICE_WS_URL:ws://localhost:8765/ws}

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          kakao:
            authorization-grant-type: authorization_code
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            client-authentication-method: client_secret_post
            scope:
              - account_email
              - profile_nickname
              - profile_image
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}

  firebase:
    enabled: true
    config: ${FIREBASE_CONFIG}

  cloud:
    gcp:
      project-id: ${PROJECT_ID}
      storage:
        bucket: ${BUCKET_NAME}
      credentials-json: ${GCP_CREDENTIALS_JSON}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

cors:
  urls:
    - http://localhost:8080
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:5174

  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE


jwt:
  secret: ${JWT_SECRET}
  time:
    access-token: 3600000
    refresh-token: 10000000

logging:
  level:
    org.springframework.security: DEBUG

kakao:
  native-app-key: ${KAKAO_NATIVE_APP_KEY}
