server:
  port: 8080

# Spring AI - Gemini (API 키는 GenAiApiKeyConfig에서 하드코딩)
spring:
  ai:
    retry:
      max-attempts: 1   # ChatClient 등 전역 재시도 1회로 제한
    model:
      chat: google-genai
    google:
      genai:
        chat:
          options:
            model: gemini-3-flash-preview
            temperature: 0.7
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

# default 프로필에서도 JWT·CORS 필요, Auth 구현 이후 토큰 교체 !!!! 꼭!!
jwt:
  secret: ${JWT_SECRET:dev-secret-at-least-256-bits-for-hs256} # 기본 값
  time:
    access-token: 3600000
    refresh-token: 10000000

# 음성 비서: 시연용 WebSocket 서버 연결 정보 (Pipecat/FastAPI 등 별도 운영 시 URL 설정)
voice:
  enabled: true
  websocket-url: ${VOICE_WS_URL:ws://localhost:8765/ws}
  description: "Gemini Live 기반 실시간 음성 비서 (STS). 모바일 앱에서 이 URL로 WebSocket 연결."

cors:
  urls:
    - http://localhost:8080
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:5174
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
