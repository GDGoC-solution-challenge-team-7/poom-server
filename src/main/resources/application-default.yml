server:
  port: 8080

# Spring AI - Gemini (API 키: 환경변수 GEMINI_API_KEY)
spring:
  ai:
    retry:
      max-attempts: 1   # ChatClient 등 전역 재시도 1회로 제한
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3-flash-preview
            temperature: 0.7
  # 파일명이 application-default.yml 이므로 별도 on-profile 불필요(중첩 시 일부 환경에서 바인딩 꼬임 방지)
  # LOCAL_* 미설정 시에도 일반 로컬 MySQL URL로 시도 (비밀번호 등은 .env 권장)
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/poom}
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo

# default 프로필에서도 JWT·CORS 필요, Auth 구현 이후 토큰 교체 !!!! 꼭!!
jwt:
  secret: ${JWT_SECRET:dev-secret-at-least-256-bits-for-hs256} # 기본 값
  time:
    access-token: 3600000
    refresh-token: 10000000

# 음성 비서: 시연용 WebSocket 서버 연결 정보 (Pipecat/FastAPI 등 별도 운영 시 URL 설정)
voice:
  enabled: true
  websocket-url: ${VOICE_WS_URL:ws://localhost:8765/ws}
  description: "Gemini Live 기반 실시간 음성 비서 (STS). 모바일 앱에서 이 URL로 WebSocket 연결."

cors:
  urls:
    - http://localhost:8080
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:5174
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
