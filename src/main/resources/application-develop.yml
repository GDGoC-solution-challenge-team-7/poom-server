server:
  port: ${PORT:8080}
#  address: 0.0.0.0
# local 프로필: VOICE_WS_URL 환경변수로 음성 서버 URL 오버라이드 가능
voice:
  websocket-url: ${VOICE_WS_URL:ws://localhost:8765/ws}

spring:
  config:
    activate:
      on-profile: develop
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}


  cloud:
    gcp:
      project-id: ${PROJECT_ID}
      storage:
        bucket: ${BUCKET_NAME}

cors:
  urls:
    - http://localhost:8080
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:5174
    - https://soom.asia
    - https://www.soom.asia

  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE

  firebase:
    enabled: true
    config: ${FIREBASE_CONFIG}


jwt:
  secret: ${JWT_SECRET}
  time:
    access-token: 3600000
    refresh-token: 10000000

logging:
  level:
    org.springframework.security: TRACE
