name: Deploy to Cloud Run (Artifact Registry)

on:
  push:
    branches: [ develop ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}

  # Artifact Registry 도커 호스트 예: asia-northeast3-docker.pkg.dev
  GAR_HOST: ${{ secrets.GCP_REGION }}-docker.pkg.dev

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   #  WIF에 필요
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      #  GCP 인증 (WIF)
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secretOVIDER }}
          service_account: ${{ secs.GCP_WORKLOAD_IDENTITY_PRrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      #  Docker가 GAR에 push 할 수 있게 설정
      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker $GAR_HOST --quiet

      # 이미지 태그 (커밋 sha)
      - name: Build & Push Docker image to GAR
        run: |
          IMAGE="$GAR_HOST/$PROJECT_ID/$REPOSITORY/poom_image:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      #  Cloud Run 배포
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated
