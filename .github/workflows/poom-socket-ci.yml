# =============================================================================
# poom-socket: GHCR 이미지 푸시 + GCP Artifact Registry 푸시 + Cloud Run 배포
# - 메인 API(dev_deploy.yml)와 동일한 GCP 프로젝트/인증(WIF)을 쓰되,
#   Cloud Run 서비스 이름·이미지 이름은 소켓 전용으로 분리.
# - 런타임 환경 변수(SPRING_BASE_URL, GOOGLE_API_KEY 등)는 배포 후 Cloud Run 콘솔에서 설정하거나,
#   "Deploy poom-socket to Cloud Run" 단계에 gcloud --set-env-vars / --set-secrets 를 추가해야 함.
#
# 필요한 GitHub Secrets:
#   CLOUD_RUN_SOCKET_SERVICE — 소켓 전용 Cloud Run 서비스 이름
#   나머지 GCP_* / GAR 은 dev_deploy.yml 과 동일
# =============================================================================

name: Poom Socket - Build, Push & Deploy

on:
  push:
    branches: [develop, main]
    paths:
      - 'poom-socket/**'
      - '.github/workflows/poom-socket-ci.yml'
  workflow_dispatch:

env:
  # --- GitHub Container Registry ---
  REGISTRY: ghcr.io
  # --- GCP 
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  GAR_HOST: ${{ secrets.GCP_REGION }}-docker.pkg.dev
  # --- 소켓 전용 Cloud Run 서비스 이름 (메인 API의 CLOUD_RUN_SERVICE 와 별도) ---
  CLOUD_RUN_SOCKET_SERVICE: ${{ secrets.CLOUD_RUN_SOCKET_SERVICE }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Workload Identity Federation 로 GCP에 OIDC 로그인할 때 필요
      id-token: write

    steps:
      # -----------------------------------------------------------------
      # 1) 저장소 체크아웃
      # -----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2) Docker 빌드 컨텍스트 결정
      #    - 이 레포 루트에 poom-socket/Dockerfile 이 있으면 모노레포 모드
      #    - 없으면 단일 레포로 간주해 루트가 컨텍스트
      # -----------------------------------------------------------------
      - name: Set Docker context path
        id: context
        run: |
          if [ -f poom-socket/Dockerfile ]; then
            echo "context=poom-socket" >> $GITHUB_OUTPUT
            echo "dockerfile=poom-socket/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=." >> $GITHUB_OUTPUT
            echo "dockerfile=Dockerfile" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------
      # 3) Docker Buildx (멀티 플랫폼·캐시용)
      # -----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------
      # 4) GHCR 로그인 — GitHub Packages 로 이미지 푸시에 사용
      # -----------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------
      # 5) GCP 인증 (Workload Identity Federation)
      # -----------------------------------------------------------------
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # -----------------------------------------------------------------
      # 6) gcloud CLI 설치
      # -----------------------------------------------------------------
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # -----------------------------------------------------------------
      # 7) Docker 가 GAR(Artifact Registry)에 push 할 수 있도록 credential helper 등록
      # -----------------------------------------------------------------
      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "$GAR_HOST" --quiet

      # -----------------------------------------------------------------
      # 8) GHCR 이미지 메타데이터(태그: 브랜치명, 커밋 SHA 등)
      # -----------------------------------------------------------------
      - name: Extract metadata for GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/poom-socket
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      # -----------------------------------------------------------------
      # 9) GAR 에 올릴 이미지 전체 경로 (메인 poom_image 와 구분: poom_socket)
      # -----------------------------------------------------------------
      - name: Set GAR image URI
        id: gar
        run: |
          IMAGE="${GAR_HOST}/${PROJECT_ID}/${REPOSITORY}/poom_socket:${GITHUB_SHA}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "GAR 이미지: $IMAGE"

      # -----------------------------------------------------------------
      # 10) 한 번 빌드하여 GHCR + GAR 두 곳에 푸시
      # -----------------------------------------------------------------
      - name: Build and push Docker image (GHCR + GAR)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.context.outputs.context }}
          file: ${{ steps.context.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.gar.outputs.image }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------
      # 11) Cloud Run 배포 — GAR 의 poom_socket 이미지 사용
      #     - 컨테이너는 8765 에서 수신
      # -----------------------------------------------------------------
      - name: Deploy poom-socket to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SOCKET_SERVICE}" \
            --image "${{ steps.gar.outputs.image }}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8765
